[kofm]
; Пример конфига kofm. Файл лежит по пути:
;   /mnt/onboard/.adds/kofm/kofm.ini
; Установка пакета его НЕ перезаписывает.

; Показывать скрытые папки (имена начинаются с точки: .adds, .kobo и др.)
; 1 — показывать, 0 — скрывать. Именно этот ключ отвечает за ".adds".
show_hidden=1

; Кегль списка файлов, пт
list_pt=8

; Наибольший кегль подписей кнопок, пт (диапазон 3..24)
btn_pt=8.0

; Гарнитура кнопок (пусто — как в Nickel)
btn_font=Kobo Nickel

; Кегль сведений/сообщений, пт
info_pt=6

; Кегль списка результатов поиска, пт
search_list_pt=10
