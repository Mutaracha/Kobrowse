name: Kobrowse test build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kobo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install Qt 5 for filesystem tests
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev pkg-config zlib1g-dev dosfstools
      - name: Test filesystem policies
        run: |
          mkdir -p build
          if ! bash tests/run-file-policy-tests.sh > build/filesystem-test.log 2>&1; then
            cat build/filesystem-test.log
            tail -n 15 build/filesystem-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/filesystem-test.log
      - name: Test protected folders on disposable FAT image
        run: |
          if ! bash tests/run-fat-policy-tests.sh > build/fat-test.log 2>&1; then
            cat build/fat-test.log
            tail -n 15 build/fat-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/fat-test.log
      - name: Test whole-row pagination (offscreen)
        run: bash tests/run-pagination-ui-tests.sh
      - name: Test ZIP creation
        run: bash tests/run-zip-tests.sh
      - name: Test package checks
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify Qt 5 test package
        run: bash scripts/build-kobo.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kobrowse-kobo-qt5-test
          path: build/KoboRoot.tgz
          if-no-files-found: error
