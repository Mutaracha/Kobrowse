name: Kobrowse test build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kobo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install Qt 5 for filesystem tests
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev pkg-config
      - name: Test filesystem policies
        run: bash tests/run-file-policy-tests.sh
      - name: Test package checks
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify Qt 5 test package
        run: bash scripts/build-kobo.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kobrowse-kobo-qt5-test
          path: build/KoboRoot.tgz
          if-no-files-found: error
