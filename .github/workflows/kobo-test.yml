name: Kobrowse test build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kobo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install Qt 5 for filesystem tests
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev pkg-config zlib1g-dev dosfstools
      - name: Test filesystem policies
        run: |
          mkdir -p build
          if ! bash tests/run-file-policy-tests.sh > build/filesystem-test.log 2>&1; then
            cat build/filesystem-test.log
            tail -n 15 build/filesystem-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/filesystem-test.log
      - name: Test protected folders on disposable FAT image
        run: |
          if ! bash tests/run-fat-policy-tests.sh > build/fat-test.log 2>&1; then
            cat build/fat-test.log
            tail -n 15 build/fat-test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/fat-test.log
      - name: Test whole-row pagination (offscreen)
        run: bash tests/run-pagination-ui-tests.sh
      - name: Test settings window and drafts (offscreen)
        run: |
          if ! bash tests/run-settings-ui-tests.sh > build/settings-test.log 2>&1; then
            cat build/settings-test.log
            grep -E '(^FAIL:|error:|undefined reference|collect2:)' build/settings-test.log | head -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/settings-test.log
      - name: Test brightness gesture and mock native backend (offscreen)
        run: bash tests/run-brightness-tests.sh
      - name: Test ZIP creation and isolated validation
        run: |
          if ! bash tests/run-zip-tests.sh > build/zip-test.log 2>&1; then
            cat build/zip-test.log
            grep -E '(error:|FAIL:|ERROR:|FAILED|AssertionError|Traceback)' build/zip-test.log | head -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/zip-test.log
      - name: Test package checks
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify Qt 5 test package
        env:
          KOBROWSE_REQUIRE_CLEAN: '1'
        run: |
          if ! bash scripts/build-kobo.sh > build/cross-build.log 2>&1; then
            cat build/cross-build.log
            grep -E '(error:|undefined reference|Error [0-9]|fatal error:)' build/cross-build.log | head -n 12 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/cross-build.log
      - name: Build experimental kobuild Qt 5 package
        env:
          KOBROWSE_REQUIRE_CLEAN: '1'
        run: |
          if ! bash scripts/build-kobuild.sh > build/kobuild-cross.log 2>&1; then
            cat build/kobuild-cross.log
            grep -E '(error:|undefined reference|Error [0-9]|fatal error:|Package check failed:|Build metadata failed:)' build/kobuild-cross.log | head -n 12 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/kobuild-cross.log
      - name: Compare ELF dependencies and ABI with NickelTC
        run: |
          if ! python3 scripts/compare-kobo-abi.py libkobrowse.so build/kobuild/libkobrowse.so > build/kobuild/abi-report.txt 2>&1; then
            cat build/kobuild/abi-report.txt
            tail -n 4 build/kobuild/abi-report.txt | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build/kobuild/abi-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: kobrowse-kobuild-qt5-experimental
          path: |
            build/kobuild/KoboRoot.tgz
            build/kobuild/build-info.json
            build/kobuild/abi-report.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: kobrowse-kobo-qt5-test
          path: |
            build/KoboRoot.tgz
            build/build-info.json
          if-no-files-found: error
