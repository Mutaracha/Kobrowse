name: Kobo test package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kobo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Test package checks
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify Qt 5 test package
        run: bash scripts/build-kobo.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kobrowse-kobo-qt5-test
          path: kobrowse_KoboRoot.tgz
          if-no-files-found: error
